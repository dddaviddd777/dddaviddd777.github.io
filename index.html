<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #66655f;
    --line: #e4e2db;
    --accent: #2f5bd3;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.06), 0 14px 32px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --surface: #1b1d22;
      --text: #ecebe6;
      --muted: #9c9a92;
      --line: #2c2f36;
      --accent: #8aa8ff;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --shadow-hover: 0 10px 30px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 56px 20px 72px; }
  header h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); max-width: 46ch; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 52px 0 16px; font-weight: 600;
  }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: transparent; }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .logo {
    flex: none; width: 60px; height: 60px; border-radius: 14px;
    object-fit: cover; background: var(--line);
  }
  .card h3 { margin: 2px 0 4px; font-size: 1.05rem; }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; }
  .tag {
    display: inline-block; margin-top: 10px; font-size: .75rem; font-weight: 600;
    color: var(--accent);
  }
  a.card:hover .tag { text-decoration: underline; }

  .others { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .other {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 14px; border-radius: 12px;
    border: 1px dashed var(--line);
  }
  .other .logo { width: 40px; height: 40px; border-radius: 10px; }
  .mono {
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .95rem;
  }
  .other h3 { margin: 0; font-size: .95rem; }
  .other p { margin: 0; color: var(--muted); font-size: .82rem; }

  footer { margin-top: 56px; color: var(--muted); font-size: .8rem; }
  @media (max-width: 480px) {
    main { padding: 36px 16px 56px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

    ]));
  }

  const oth = document.getElementById("others");
  for (const o of others) {
    const logo = o.logo
      ? el("img", { class: "logo", src: o.logo, alt: "", style: `background:${o.color};padding:6px;object-fit:contain` })
      : el("div", { class: "logo mono", style: `background:${o.color}`, "aria-hidden": "true" }, o.mono);
    oth.append(el("div", { class: "other" }, [
      logo,
      el("div", {}, [el("h3", {}, o.name), el("p", {}, o.desc)]),
    ]));
  }
</script>
</body>
</html>
